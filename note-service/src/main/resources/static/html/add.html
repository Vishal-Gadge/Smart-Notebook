<!DOCTYPE html>
<html>
<head><title>Add Note</title><link rel="stylesheet" href="/notes/css/style.css"></head>
<body>
<div class="container">
    <nav><a href="/notes">Dashboard</a><a href="/notes/html/add.html" class="active">Add Note</a></nav>
    <div class="card">
        <h2>Add New Note</h2>
        <label>Title</label><input id="title">
        <label>Text</label><textarea id="text"></textarea>
        <button id="addNoteBtn">
            <span id="addNoteBtnSpinner" class="spinner" style="display: none;"></span>
            <span id="addNoteBtnText">Save Note</span>            
        </button>
        <div id="result"></div>
        <div id="toast"></div>
    </div>
</div>
<script src="/notes/js/toast.js"></script>
<script src="/notes/js/addNote.js"></script>
</body>
</html>
